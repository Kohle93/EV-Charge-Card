# EV Charge Card – Beispielkonfiguration (v1.1) mit zwei Fahrzeugen
# Entitäts-IDs sind Platzhalter -> an deine Auto- und Wallbox-Entitäten anpassen.
# Auto-Bilder (am besten PNG mit transparentem Hintergrund) nach /config/www/ev/ legen –
# z. B. die mitgelieferten, frei nutzbaren Illustrationen examples/auto.png und examples/auto-2.png
# oder eigene Fotos, an denen du die Rechte hast.
# Alles lässt sich auch im visuellen Editor einstellen (Fahrzeug oben wählen, Tabs Allgemein · Anzeige · Fahrzeug · Werte · Buttons · Design).
# Farben: Farbpicker-Werte [r, g, b], Hex (#9ccc3c) oder HA-Farbnamen (green, amber …).

type: custom:ev-charge-card

# ---------- Mehrere Fahrzeuge ----------
show_dots: true              # Punkte unten in der Mitte (ab 2 Fahrzeugen)
swipe: true                  # Wischen schaltet um
remember_vehicle: true       # zuletzt gewähltes Fahrzeug merken

# ---------- Anzeige ----------
image_position: right        # right | left
title_position: top          # top (volle Breite) | column (linke Spalte)
left_width: 45               # % Breite linke Spalte
stack_below: 260             # unter dieser Kartenbreite (px) Bild unter den Titel, 0 = nie

# ---------- Design (wie Abfall-Karte / Status-Übersicht) ----------
accent_color: [3, 169, 244]
card_radius: 24
bg_mode: tinted              # Werte-Kacheln: theme | tinted | accent | custom | none
bg_opacity: 10
icon_bg_mode: accent         # none | accent | theme | custom
highlight: glow              # beim Laden / Tank fast leer: none | glow | pulse | border | scale

vehicles:
  # ---------- Fahrzeug 1: Elektroauto ----------
  - vehicle_type: ev
    title: Mein E-Auto
    title_icon: mdi:car-electric
    subtitle_entity: sensor.wallbox_car_state
    image:
      url: /local/ev/auto.png
      max_height: 160
      glow_entity: sensor.wallbox_car_state   # Leuchten unter dem Auto beim Laden
      glow_state: "Charging"
    charge_control:            # Start/Stopp-Buttons unter dem Auto, nur sichtbar wenn eingesteckt
      show_entity: binary_sensor.wallbox_car_connected
      show_state: "on"
      start_entity: button.wallbox_start_charging
      stop_entity: button.wallbox_stop_charging
      charging_entity: binary_sensor.wallbox_charging
      charging_state: "on"
    fields:
      - entity: sensor.car_battery_level
        name: Ladestand
        size: large
        show_bar: true
        color_thresholds:
          - { from: 0,  color: [244, 67, 54] }
          - { from: 20, color: [255, 152, 0] }
          - { from: 50, color: [76, 175, 80] }
      - entity: sensor.car_range
        name: Reichweite
        icon: mdi:map-marker-distance
        decimals: 0
      - entity: sensor.wallbox_power
        name: Ladeleistung
        icon: mdi:lightning-bolt
        multiply: 0.001         # W -> kW
        unit: kW
        decimals: 1
    button_bar:
      entity: select.wallbox_charging_mode
    buttons:
      - option: Default
        name: Standard
        icon: mdi:ev-station
      - option: Eco
        icon: mdi:leaf
      - option: Next Trip
        icon: mdi:calendar-clock
      - type: action            # Favoriten-Stern
        icon: mdi:star
        entity: input_boolean.ev_favorit

  # ---------- Fahrzeug 2: Benzin / Diesel ----------
  - vehicle_type: combustion
    title: Zweitwagen
    title_icon: mdi:car
    subtitle: Benzin
    accent_color: [255, 152, 0]  # eigene Akzentfarbe nur für dieses Fahrzeug (optional)
    image:
      url: /local/ev/auto-2.png
      max_height: 160
    fuel:                        # Glow leuchtet, sobald der Tank ≤ threshold ist
      entity: sensor.zweitwagen_tank
      threshold: 15              # in der Einheit der Entität, meist %
      color: [244, 67, 54]
    fields:
      - entity: sensor.zweitwagen_tank
        name: Tank
        icon: mdi:gas-station
        size: large
        show_bar: true
        color_thresholds:
          - { from: 0,  color: [244, 67, 54] }
          - { from: 25, color: [255, 152, 0] }
          - { from: 50, color: [76, 175, 80] }
      - entity: sensor.zweitwagen_reichweite
        name: Reichweite
        icon: mdi:map-marker-distance
      - entity: sensor.zweitwagen_kilometerstand
        name: Kilometerstand
        icon: mdi:counter

